experiment_id: eod-close-source-v1
classification: exploratory_post_result_execution_sensitivity
created_date: "2026-08-01"

base:
  profile: corrected_execution
  tier: halt_aware
  dividend_mode: with_dividends
  slippage_per_share: 0.0025
  data_release: data_release_v1
  daily_close: benchmark_release_v1/spy_daily_raw_close.csv
  financing_rates: data/reference/financing_rates_v1/financing_rates_daily.csv
  evaluation_start: "2024-05-01"
  evaluation_end: "2026-07-09"

variants:
  - id: minute_1559_close
    label: 15:59 minute close
    price_source: minute_close
    extra_cost_bps: 0.0
  - id: independent_daily_close_no_auction_cost
    label: Independent daily close, no extra auction cost
    price_source: independent_daily_close
    extra_cost_bps: 0.0
  - id: independent_daily_close_auction_0p5bp
    label: Independent daily close + 0.5 bp auction cost
    price_source: independent_daily_close
    extra_cost_bps: 0.5
  - id: independent_daily_close_auction_1bp
    label: Independent daily close + 1 bp auction cost
    price_source: independent_daily_close
    extra_cost_bps: 1.0
  - id: tail_twap_5m
    label: Last 5 scheduled-minute TWAP
    price_source: tail_twap
    twap_minutes: 5
    extra_cost_bps: 0.0
  - id: tail_twap_10m
    label: Last 10 scheduled-minute TWAP
    price_source: tail_twap
    twap_minutes: 10
    extra_cost_bps: 0.0
  - id: tail_twap_15m
    label: Last 15 scheduled-minute TWAP
    price_source: tail_twap
    twap_minutes: 15
    extra_cost_bps: 0.0
  - id: tail_twap_30m
    label: Last 30 scheduled-minute TWAP
    price_source: tail_twap
    twap_minutes: 30
    extra_cost_bps: 0.0

interpretation:
  daily_close_is_proxy: true
  daily_close_note: Yahoo Finance raw daily close is an independent close proxy,
    not an official auction-fill or MOC execution feed.
  twap_note: Equal shares at each of the final 10 scheduled minute closes;
    modelled as an equivalent average exit price. Queueing, partial fills and
    market impact are not included.
  auction_cost_note: Incremental to the base per-share slippage and charged only
    on the EOD exit leg.
