# Candidate contract for the first frozen data release.
# This is intentionally stricter than an exploratory pipeline invocation.
release_id: data-v1.0
status: candidate

input: SPY_1min_2008_202607_merged.parquet
dividends: spy_dividends_full.csv
calendar: XNYS
input_timezone: America/New_York
bar_label: start
source_split: 2016-01-04
halt_bar_policy: absent

# The research claim begins in 2008, so the contract starts at the first
# calendar day of that year rather than silently accepting the first observed
# bar. The current source begins 2008-01-22; freezing remains blocked until the
# 13 earlier XNYS sessions are backfilled or the research start is explicitly
# re-scoped with rationale.
expected_start: 2008-01-01
expected_end: 2026-07-09
max_boundary_sessions_missing: 0

duplicate_policy: error
strategy_vwap_source: hlc3
source_precedence: null
confirm_file_order_precedence: false
dividend_duplicate_policy: error
confirm_dividend_sum: false

requirements_lock: requirements.lock
preflight_self_test: true
